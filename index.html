
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Card Match Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/logo.png" type="image/png">
</head>
<body>

<section id="startScreen" class="screen active">
  <img src="assets/logo.png" class="logo" />
  <h1>Tap to Start</h1>
  <button onclick="goSetup()">START</button>
</section>

<section id="setupScreen" class="screen">
  <h2>Players Setup</h2>

  <div class="player">
    <input id="p1name" placeholder="Player 1 name" />
    <div id="p1avatars" class="avatars"></div>
  </div>

  <div class="player">
    <input id="p2name" placeholder="Player 2 name" />
    <div id="p2avatars" class="avatars"></div>
  </div>

  <button onclick="startGame()">NEXT</button>
</section>

<section id="gameScreen" class="screen">
  <div class="topPanel">
    <div id="scoreBoard"></div>

  </div>

  <div id="gameBoard"></div>
</section>

<section id="winScreen" class="screen">
  <h1 id="winnerText"></h1>
  <button onclick="nextLevel()">NEXT LEVEL</button>
</section>

<script src="script.js"></script>
</body>
</html>
